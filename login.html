<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in | PCN Portal</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/auth.css" />
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="authTitle">
    <section class="auth-brand" aria-label="PCN portal">
      <div class="auth-brand-top">
        <img src="/tokin-header-logo.png" alt="TOKIN a YAGEO company" />
        <span class="auth-brand-index">PCN / PORTAL</span>
      </div>
      <div class="auth-brand-copy">
        <p class="auth-kicker">Product change management</p>
        <p class="auth-brand-headline">Every change.<br /><span>Clearly connected.</span></p>
        <p>Create, review and track product change notifications in one place.</p>
      </div>
      <div class="auth-brand-footer"><span class="auth-brand-marker" aria-hidden="true"></span> Built for precision and clarity</div>
    </section>
    <div class="auth-content">
      <div class="auth-content-top"><span>Account access</span><span>PCN SYSTEM</span></div>
      <h1 id="authTitle">Welcome</h1>
      <p id="authDescription">Enter your 7 digit Employee ID to continue to the PCN portal.</p>
      <p id="authMessage" role="status" aria-live="polite"></p>
      <form id="loginForm">
        <div class="auth-field auth-field--icon">
          <svg class="auth-field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9h16M3 15h16M10 4 8 20M16 4l-2 16" />
          </svg>
          <label for="employeeId">Employee ID</label>
          <input id="employeeId" name="employeeId" type="text" inputmode="numeric" autocomplete="username" pattern="[0-9]{7}" maxlength="7" placeholder=" " title="Enter your 7 digit Employee ID" required />
        </div>
        <button class="primary-button auth-submit" type="submit">
          <span>Sign in</span>
        </button>
      </form>
    </div>
  </main>
  <script src="/session-client.js"></script>
  <script src="/login.js"></script>
</body>
</html>
